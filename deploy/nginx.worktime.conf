# Worktime 前端静态 + 反代两台后端
# 这台 nginx 的 http 块末尾已 include conf.d/*.conf，所以放到：
#   /usr/local/nginx-1.23.0/conf.d/worktime.conf
# 80/8080/8088 已被其它服务占用，本配置用独立端口 8090（可改任意空闲端口；记得防火墙放行）
# 访问： http://<your-server-ip>:8090/
# 改完执行： nginx -t && nginx -s reload

upstream worktime_backend {
    # 两台后端机器（改成真实内网 IP）。默认轮询；任一台都能处理任意请求（共享同一个 MySQL，无会话粘性要求）
    server <backend-host-1>:18760 max_fails=2 fail_timeout=10s;
    server <backend-host-2>:18760 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen       8090;         # 独立端口(80/8080/8088 已被占用)；访问 http://<your-server-ip>:8090/
    server_name  _;

    # 前端打包产物
    root   /opt/worktime/frontend/dist;
    index  index.html;

    # 单页应用：找不到的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反代到两台后端
    location /worktime-api/ {
        proxy_pass         http://worktime_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 提交是逐条调原系统接口，批量时可能较慢，给足超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        client_max_body_size  10m;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
